name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  check:
    name: Foundry Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: forge --version

      - name: Install dependencies (if submodules not yet populated)
        run: |
          if [ ! -d "lib/forge-std/src" ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
          if [ ! -d "lib/v4-core/src" ]; then
            forge install Uniswap/v4-core --no-commit
          fi
          if [ ! -d "lib/v4-periphery/src" ]; then
            forge install Uniswap/v4-periphery --no-commit
          fi
          if [ ! -d "lib/uniswap-hooks/src" ]; then
            forge install OpenZeppelin/uniswap-hooks --no-commit
          fi
          if [ ! -d "lib/openzeppelin-contracts/contracts" ]; then
            forge install OpenZeppelin/openzeppelin-contracts --no-commit
          fi

      - name: Check formatting
        run: |
          if [ -n "$(find src test script -name '*.sol' -print -quit 2>/dev/null)" ]; then
            forge fmt --check
          else
            echo "No Solidity files to format yet."
          fi

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: |
          if [ -n "$(find test -name '*.t.sol' -print -quit 2>/dev/null)" ]; then
            forge test -vvv
          else
            echo "No test files yet; skipping forge test."
          fi
