[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = false
bytecode_hash = "none"
ffi = false

remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Fuzzing profile (fizz): Medusa/Echidna identify contracts deployed by the harness via the CBOR metadata hash;
# with `bytecode_hash = "none"` their runtime coverage cannot be attributed. Everything else inherits `default`.
[profile.fuzz]
bytecode_hash = "ipfs"
